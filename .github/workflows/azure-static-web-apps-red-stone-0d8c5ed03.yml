name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          lfs: false

      # Build with GitHub-hosted Node instead of Oryx. Oryx only ships a fixed
      # list of Node builds and rejects the engines.node range upstream pins,
      # so we build here and hand SWA a pre-built ./out folder.
      - name: Set up Node.js (version from package.json engines.node)
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: yarn install

      - name: Build
        run: npm run build

      - name: Stamp version.json with commit
        run: |
          VERSION=$(jq -r '.version' public/version.json)
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "{\"version\": \"${VERSION}\", \"commit\": \"${SHORT_SHA}\"}" > out/version.json

      - name: Copy SWA config into build output
        run: cp staticwebapp.config.json out/

      - name: Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_KIND_FLOWER_01F5DB310 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "out"        # pre-built output, not source
          api_location: ""
          output_location: ""
          skip_app_build: true       # do not let Oryx touch it
